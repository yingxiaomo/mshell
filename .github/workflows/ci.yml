name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  # Auto-version: use git commit count as patch number (0.1.{count})
  # For tags (v1.0.0), the tag version takes precedence in the release job.
  APP_VERSION: 0.1.${{ github.run_number }}
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: npm install --silent
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx vitest run
      - run: cargo clippy --workspace --lib -- -D warnings
      - run: cargo test --workspace --lib

  build:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: npm install --silent
      # Inject auto-version into tauri.conf.json
      - run: |
          $v = "${{ env.APP_VERSION }}"
          $c = Get-Content crates/app/tauri.conf.json -Raw
          $c = $c -replace '"version": ".*?"', ('"version": "' + $v + '"')
          Set-Content crates/app/tauri.conf.json -Value $c
          echo "Building version: $v"
      - run: npm run tauri build
      # Publish to GitHub Releases
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: v${{ env.APP_VERSION }}
          body: "自动构建 ${{ env.APP_VERSION }}"
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          make_latest: true
          fail_on_unmatched_files: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: npm install --silent
      - run: npm run tauri build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
